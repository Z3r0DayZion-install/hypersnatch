<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HyperSnatch — Capture the artifact. Keep the proof.">
  <title>HyperSnatch social card</title>
  <defs>
    <linearGradient id="og_bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0D12"/>
      <stop offset="1" stop-color="#10161F"/>
    </linearGradient>
    <radialGradient id="og_glow" cx="600" cy="220" r="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20C7FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#20C7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hs_page_o" x1="256" y1="132" x2="256" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F6FC"/>
      <stop offset="1" stop-color="#D4DEEC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og_bg)"/>
  <rect width="1200" height="630" fill="url(#og_glow)"/>

  <!-- Faint hash motif -->
  <g font-family="'Cascadia Code','Consolas',ui-monospace,monospace" font-size="15" fill="#20C7FF" opacity="0.08">
    <text x="40" y="64">sha256 9ef2035a305e2fe95fed43351bca15d4</text>
    <text x="40" y="590">asar   0675e529a4f17427931958e2bd8fa445</text>
    <text x="760" y="64">bundle b748daecf5d7bf4b3a07116ae90e5cbe</text>
  </g>

  <!-- Mark (centered top) -->
  <g transform="translate(472 64) scale(0.5)">
    <path d="M192 132 H304 L340 168 V360 L327 378 L313 360 L300 378 L287 360 L273 378 L260 360 L247 378 L233 360 L220 378 L207 360 L193 378 L180 360 V144 Q180 132 192 132 Z"
          fill="url(#hs_page_o)" stroke="#0A0D12" stroke-width="6" stroke-linejoin="round"/>
    <path d="M304 132 L304 168 L340 168 Z" fill="#B6C3D4"/>
    <rect x="200" y="206" width="12" height="12" rx="2" fill="#E6B450"/>
    <rect x="220" y="207" width="98" height="10" rx="5" fill="#2E3A49"/>
    <rect x="200" y="240" width="12" height="12" rx="2" fill="#E6B450"/>
    <rect x="220" y="241" width="118" height="10" rx="5" fill="#2E3A49"/>
    <rect x="200" y="274" width="12" height="12" rx="2" fill="#E6B450"/>
    <rect x="220" y="275" width="78" height="10" rx="5" fill="#2E3A49"/>
    <g stroke="#20C7FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M72 158 V96 Q72 72 96 72 H158"/>
      <path d="M440 158 V96 Q440 72 416 72 H354"/>
      <path d="M72 354 V416 Q72 440 96 440 H158"/>
      <path d="M440 354 V416 Q440 440 416 440 H354"/>
    </g>
    <circle cx="340" cy="358" r="52" fill="#0A0D12" stroke="#23D18B" stroke-width="8"/>
    <path d="M318 358 l14 17 l30 -36" stroke="#23D18B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="600" y="438" text-anchor="middle" font-family="'Segoe UI Semibold','Segoe UI',Inter,Arial,sans-serif" font-size="104" font-weight="700" letter-spacing="2" fill="#EAF2FF">HyperSnatch</text>
  <text x="600" y="498" text-anchor="middle" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="38" font-weight="500" fill="#20C7FF">Capture the artifact. Keep the proof.</text>
  <text x="600" y="558" text-anchor="middle" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="6" fill="#607089">THE PROOF FOUNDRY</text>
</svg>
