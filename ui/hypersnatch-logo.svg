<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061018"/>
      <stop offset="1" stop-color="#0A1A28"/>
    </linearGradient>
    <linearGradient id="factory_body" x1="256" y1="210" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#112233"/>
      <stop offset="1" stop-color="#091622"/>
    </linearGradient>
    <linearGradient id="roof_grad" x1="130" y1="180" x2="382" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A3D5C"/>
      <stop offset="1" stop-color="#0F2438"/>
    </linearGradient>
    <radialGradient id="glow_top" cx="256" cy="100" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20C7FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#20C7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow_filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg_grad)"/>
  <!-- Subtle glow overlay -->
  <rect width="512" height="512" rx="112" fill="url(#glow_top)"/>
  <!-- Border ring -->
  <rect x="14" y="14" width="484" height="484" rx="100" stroke="#1B3A52" stroke-width="6" fill="none"/>

  <!-- Factory building body -->
  <rect x="124" y="216" width="264" height="172" rx="4" fill="url(#factory_body)" stroke="#2E5472" stroke-width="3"/>

  <!-- Factory roof / trapezoid -->
  <path d="M100 216 L168 178 L344 178 L412 216Z" fill="url(#roof_grad)" stroke="#3A6280" stroke-width="3"/>

  <!-- Chimney stacks -->
  <rect x="156" y="110" width="32" height="70" rx="6" fill="#0D2235" stroke="#2E5472" stroke-width="2.5"/>
  <rect x="210" y="128" width="28" height="52" rx="6" fill="#0D2235" stroke="#2E5472" stroke-width="2.5"/>
  <rect x="274" y="120" width="28" height="60" rx="6" fill="#0D2235" stroke="#2E5472" stroke-width="2.5"/>
  <rect x="326" y="112" width="32" height="68" rx="6" fill="#0D2235" stroke="#2E5472" stroke-width="2.5"/>

  <!-- Chimney caps (cyan accent) -->
  <rect x="152" y="104" width="40" height="10" rx="4" fill="#20C7FF" filter="url(#glow_filter)" opacity="0.9"/>
  <rect x="206" y="122" width="36" height="9" rx="4" fill="#20C7FF" filter="url(#glow_filter)" opacity="0.75"/>
  <rect x="270" y="114" width="36" height="9" rx="4" fill="#20C7FF" filter="url(#glow_filter)" opacity="0.8"/>
  <rect x="322" y="106" width="40" height="10" rx="4" fill="#20C7FF" filter="url(#glow_filter)" opacity="0.9"/>

  <!-- Smoke wisps -->
  <path d="M172 104 Q168 86 176 72 Q180 58 172 48" stroke="#20C7FF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M342 106 Q348 88 340 74 Q336 60 344 50" stroke="#20C7FF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- Factory windows - top row -->
  <rect x="148" y="234" width="30" height="24" rx="4" fill="#0A1F30" stroke="#20C7FF" stroke-width="1.8" opacity="0.9"/>
  <rect x="196" y="234" width="30" height="24" rx="4" fill="#0A1F30" stroke="#20C7FF" stroke-width="1.8" opacity="0.9"/>
  <rect x="286" y="234" width="30" height="24" rx="4" fill="#0A1F30" stroke="#20C7FF" stroke-width="1.8" opacity="0.9"/>
  <rect x="334" y="234" width="30" height="24" rx="4" fill="#0A1F30" stroke="#20C7FF" stroke-width="1.8" opacity="0.9"/>

  <!-- Window glow fills -->
  <rect x="150" y="236" width="26" height="20" rx="3" fill="#20C7FF" opacity="0.12"/>
  <rect x="198" y="236" width="26" height="20" rx="3" fill="#23D18B" opacity="0.12"/>
  <rect x="288" y="236" width="26" height="20" rx="3" fill="#20C7FF" opacity="0.12"/>
  <rect x="336" y="236" width="26" height="20" rx="3" fill="#23D18B" opacity="0.12"/>

  <!-- Central door / gate -->
  <rect x="226" y="310" width="60" height="78" rx="6" fill="#081420" stroke="#20C7FF" stroke-width="2.2"/>
  <rect x="230" y="314" width="52" height="70" rx="4" fill="#0A1D2E" opacity="0.9"/>
  <!-- Door handle -->
  <circle cx="269" cy="350" r="4" fill="#20C7FF" opacity="0.8"/>

  <!-- Conveyor belt suggestion at base -->
  <path d="M110 390 L402 390" stroke="#2E5472" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 390 L402 390" stroke="#20C7FF" stroke-width="1.5" stroke-linecap="round" opacity="0.4" stroke-dasharray="18 10"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="400" rx="148" ry="8" fill="#20C7FF" opacity="0.06"/>

  <!-- Proof stamp / badge (top right corner detail) -->
  <circle cx="406" cy="106" r="36" fill="#061018" stroke="#20C7FF" stroke-width="2.5"/>
  <path d="M393 106 L400 114 L419 96" stroke="#23D18B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow_filter)"/>
</svg>
